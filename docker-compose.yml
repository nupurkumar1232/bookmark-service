services:
  postgres:
    image: postgres:16
    container_name: bookmark-postgres
    environment:
      POSTGRES_USER: bookmark
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: bookmarks
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
